# Produção: site + banco (+ HTTPS automático com Caddy, OPCIONAL).
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Dois jeitos de publicar:
#  A) Nginx/proxy externo (padrão): o app fica na porta ${APP_PORT:-3400} e o seu proxy encaminha o domínio para ela.
#  B) Sem proxy: suba também o Caddy (HTTPS automático nas portas 80/443):  docker compose --profile caddy up -d --build
# Passo a passo completo em DEPLOY.md
name: turmadobairro-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_DB: turmadobairro
    # SEM "ports": o banco só é acessível pela rede interna do Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turma -d turmadobairro"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://turma:${POSTGRES_PASSWORD}@db:5432/turmadobairro?schema=public
      UPLOAD_DIR: /app/storage/uploads
      # Quantos proxies confiáveis ficam na frente do app: 1 = só o nginx (ou só o Caddy).
      # Com Cloudflare na frente do nginx use 2 (defina TRUSTED_PROXY_HOPS=2 no .env.production).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - uploads:/app/storage/uploads
    # Porta de entrada para o seu proxy (nginx). Restrinja no firewall ao IP do proxy (ufw allow from IP to any port 3400).
    # Se o nginx roda NESTE servidor, use APP_BIND=127.0.0.1 no .env.production.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3400}:3000"
    networks: [internal]

  # Tarefa agendada (a cada 5 min): concilia pagamentos, expira reservas, reenvia WhatsApp, limpa sessões.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET no .env.production}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 300; curl -fsS -m 55 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron || echo "[cron] falhou"; echo; done'
    networks: [internal]

  # OPCIONAL (jeito B): só sobe com  --profile caddy
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # OPCIONAL (WhatsApp): docker compose --profile whatsapp ... up -d
  # Documentação: https://github.com/wppconnect-team/wppconnect-server
  # Rede interna: use WPP_BASE_URL=http://wppconnect:21465 no .env.production
  wppconnect:
    # Imagem oficial + sharp compilado na própria máquina (roda em VM com CPU virtual antiga). Veja deploy/wppconnect/Dockerfile.
    build: ./deploy/wppconnect
    image: turmadobairro-wppconnect:local
    profiles: ["whatsapp"]
    restart: unless-stopped
    environment:
      # Mesma chave do WPP_SECRET_KEY do .env.production (o app usa ela para gerar o token de acesso).
      # (sem ":?" de propósito: quem não usa WhatsApp não precisa definir.)
      SECRET_KEY: ${WPP_SECRET_KEY:-}
    volumes:
      - wppdata:/usr/src/wpp-server/userDataDir
      - wpptokens:/usr/src/wpp-server/tokens
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  wppdata:
  wpptokens:
